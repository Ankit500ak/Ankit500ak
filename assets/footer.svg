<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%"><defs>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="1.7" fill="#000"/></pattern>
<pattern id="dots2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.2" fill="#fff"/></pattern>

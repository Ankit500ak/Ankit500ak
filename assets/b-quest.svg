<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%"><defs>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="1.7" fill="#000"/></pattern>
<pattern id="dots2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.2" fill="#fff"/></pattern>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="1.6"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1000" height="900" fill="url(#fade)"/></mask>
</defs><style>
*{transform-box:fill-box}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,9px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes eyeblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.07)}}
@keyframes cover{0%,5%{transform:scaleX(1)}30%,92%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes segin{0%,6%{opacity:0}14%,86%{opacity:1}100%{opacity:0}}
@keyframes marq{to{transform:translateX(-1500px)}}
@keyframes marqr{from{transform:translateX(-1500px)}to{transform:translateX(0)}}
@keyframes sweep{0%,55%{transform:translateX(-320px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes wave{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.7);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes key{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flash{0%,90%,100%{opacity:0}93%{opacity:.85}96%{opacity:0}98%{opacity:.6}}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-5px,1px)}95%{transform:translate(5px,-1px)}97%{transform:translate(-2px,0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,80%{transform:translate(9px,-5px)}}
@keyframes grow{0%,8%{transform:scaleX(0)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.drift{animation:drift 3s ease-in-out infinite alternate}
.pulse{transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
.pop{transform-origin:center;animation:pop 1.1s ease-in-out infinite}
.shake{transform-origin:center;animation:shake .45s steps(2) infinite}
.blink{animation:blink 1s steps(1) infinite}
.spin{transform-origin:center;animation:spin 40s linear infinite}
.spinr{transform-origin:center;animation:spinr 60s linear infinite}
.float{transform-origin:center;animation:float 3.4s ease-in-out infinite}
.twinkle{transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.blinkeye{transform-origin:center;animation:eyeblink 5s infinite}
.cov{transform-origin:right center;animation:cover 9s steps(24) infinite}
.seg{animation:segin 6s ease-out infinite}
.marq{animation:marq 28s linear infinite}.marqr{animation:marqr 34s linear infinite}
.sweep{animation:sweep 5s ease-in-out infinite}
.wave{transform-origin:center;animation:wave 2.4s ease-out infinite}
.sway{transform-origin:bottom center;animation:sway 2.8s ease-in-out infinite}
.key{animation:key .9s steps(1) infinite}
.flash{animation:flash 7s infinite}
.glitch{animation:glitch 6s infinite}
.bounce{animation:bounce 1.1s ease-in-out infinite}
.look{animation:look 6s ease-in-out infinite}
.grow{transform-origin:left center;animation:grow 5s ease-out infinite}

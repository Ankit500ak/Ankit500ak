*{transform-box:fill-box}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,9px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes eyeblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.07)}}
@keyframes cover{0%,5%{transform:scaleX(1)}30%,92%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes segin{0%,6%{opacity:0}14%,86%{opacity:1}100%{opacity:0}}
@keyframes marq{to{transform:translateX(-1500px)}}
@keyframes marqr{from{transform:translateX(-1500px)}to{transform:translateX(0)}}
@keyframes sweep{0%,55%{transform:translateX(-320px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes wave{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.7);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes key{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flash{0%,90%,100%{opacity:0}93%{opacity:.85}96%{opacity:0}98%{opacity:.6}}

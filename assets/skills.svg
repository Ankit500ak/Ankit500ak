.blink{animation:blink 1s steps(1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.s1{animation:slide .8s ease-out both}.s2{animation:slide .8s .3s ease-out both}.s3{animation:slide .8s .6s ease-out both}
.flash{animation:flash 6s infinite}

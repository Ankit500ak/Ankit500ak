.spin{transform-origin:center;animation:spin 40s linear infinite}
.spinr{transform-origin:center;animation:spinr 60s linear infinite}
.float{transform-origin:center;animation:float 3.4s ease-in-out infinite}
.twinkle{transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.blinkeye{transform-origin:center;animation:eyeblink 5s infinite}
.cov{transform-origin:right center;animation:cover 9s steps(24) infinite}
.seg{animation:segin 6s ease-out infinite}
.marq{animation:marq 28s linear infinite}.marqr{animation:marqr 34s linear infinite}
.sweep{animation:sweep 5s ease-in-out infinite}
.wave{transform-origin:center;animation:wave 2.4s ease-out infinite}
.sway{transform-origin:bottom center;animation:sway 2.8s ease-in-out infinite}
.key{animation:key .9s steps(1) infinite}
.flash{animation:flash 7s infinite}
.glitch{animation:glitch 6s infinite}
.bounce{animation:bounce 1.1s ease-in-out infinite}
.look{animation:look 6s ease-in-out infinite}
.grow{transform-origin:left center;animation:grow 5s ease-out infinite}

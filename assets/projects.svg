@keyframes cover{0%,5%{transform:scaleX(1)}30%,92%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes segin{0%,6%{opacity:0}14%,86%{opacity:1}100%{opacity:0}}
@keyframes marq{to{transform:translateX(-1500px)}}
@keyframes marqr{from{transform:translateX(-1500px)}to{transform:translateX(0)}}
@keyframes sweep{0%,55%{transform:translateX(-320px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}

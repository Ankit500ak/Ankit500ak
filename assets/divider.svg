<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><style>
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,9px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake{0%,100%{transform:rotate(-6deg) translate(0,0)}25%{transform:rotate(-4deg) translate(2px,-2px)}75%{transform:rotate(-8deg) translate(-2px,2px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes flash{0%,90%,100%{opacity:0}93%{opacity:.9}96%{opacity:0}98%{opacity:.7}}
.drift{animation:drift 3s ease-in-out infinite alternate}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
.shake{transform-box:fill-box;transform-origin:center;animation:shake .5s steps(2) infinite}
.blink{animation:blink 1s steps(1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.s1{animation:slide .8s ease-out both}.s2{animation:slide .8s .3s ease-out both}.s3{animation:slide .8s .6s ease-out both}
.flash{animation:flash 6s infinite}
</style><rect y="26" width="1000" height="8" fill="#000"/><g class="s1"><polygon points="380,6 620,6 640,54 360,54" fill="#fff" stroke="#000" stroke-width="5"/></g><text x="500" y="40" text-anchor="middle" font-family="Impact,'Arial Black','Arial Narrow Bold',sans-serif" font-size="26" letter-spacing="4">TO BE CONTINUED<tspan class="blink"> ▶</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>